entities:
  - decision: godot-native-port
    core:
      status: accepted
      confidence: confirmed
      title: Native Godot port
      summary: "User-authorized replacement of Rust and Bevy with Godot 4.7.2 and GDScript, targeting Windows and browser. Supersedes rust-and-bevy-baseline and headless-simulation-boundary in this repository while preserving deterministic behavior."
      references: [rust-and-bevy-baseline, headless-simulation-boundary, village-simulation, village-client]
  - decision: godot-content-and-persistence
    core:
      status: accepted
      confidence: confirmed
      title: Godot resources and fresh saves
      summary: "User-authorized conversion of RON content to Godot text resources and replacement of Rust saves by a new versioned format. Existing saves need not import. Historical data-first-content-pipeline and snapshots-and-event-ledger remain behavioral guidance."
      references: [data-first-content-pipeline, snapshots-and-event-ledger, simulation-persistence]
  - decision: godot-household-dashboard
    core:
      status: accepted
      confidence: confirmed
      title: Household dashboard and redistributable artwork
      summary: "User-authorized household dashboard with central village view, household portraits, selected resident needs and orders, and village feed. Replace restricted source artwork with original artwork."
      references: [village-client, pixel-art-presentation]
  - decision: godot-deterministic-data-core
    core:
      status: accepted
      confidence: confirmed
      title: RefCounted simulation and detached projections
      summary: "Use RefCounted simulation classes, sorted authoritative iteration, explicit unsigned arithmetic, detached snapshots and typed command objects."
      rationale: ["[ai] A scene-independent data core preserves headless testing and prevents presentation timing from changing the simulation."]
      references: [godot-native-port, deterministic-tick-and-phase-order, authoritative-client-projection]

  - decision: godot-parity-and-model-gates
    core:
      status: accepted
      confidence: confirmed
      title: Independent reference traces and Godot boundary checks
      summary: "Capture fixtures from the frozen Rust baseline; supplement pinned PASM with a local Godot mapping and dependency-boundary gate. Keep phase methods together for direct parity review."
      rationale: ["[ai] The pinned scanner does not index GDScript. Explicit path and boundary checks close that gap without modifying the shared dependency."]
      references: [godot-native-port, scenario-test-harness, godot-deterministic-data-core]

  - decision: godot-floating-hud
    core:
      status: accepted
      confidence: confirmed
      title: Full-window simulation with floating household HUD
      summary: "User-authorized replacement of the boxed dashboard layout: the simulation occupies the full window, with toolbar, resident details, household portraits and village feed floating above it. Supersedes the spatial layout of godot-household-dashboard while preserving its controls."
      rationale: ["[ai] Only visible HUD panels intercept pointer input; opening drawers never resizes or hides the simulation viewport."]
      references: [godot-household-dashboard, village-client]

  - decision: godot-order-management-completion
    core:
      status: accepted
      confidence: confirmed
      title: Complete household order management
      summary: "User-authorized completion of promotion, force and reordering. Existing baseline commands retain their behavior; new commands validate at the next tick and persist with the queue."
      rationale:
        - "[ai] Promotion selects the next waiting job without interrupting the active head. Reordering cannot displace an active or urgent-paused head. Do now interrupts household work at the tick boundary, preserves the displaced task, and raises the selected task within the Player band; Urgent still outranks it."
        - "[ai] Save format 2 records the extended command vocabulary. The reader continues to accept format 1; malformed queue state is rejected before replacing the world."
        - "[ai] Animation and event-based sound remain client-only. Observable activity may be projected, but outsider needs and intentions remain private."
        - "[ai] Multi-seed scripted reference runs supplement the original 84 behavior checks; tests explicitly cover all new commands and save/resume transitions."
      references: [godot-native-port, action-priority-bands, player-command-boundary, godot-parity-and-model-gates]
    implementation:
      status: declared
      paths: [sim/command.gd, sim/simulation.gd, client/main.gd, client/village_view.gd, tests/order_tests.gd, tests/differential_tests.gd]

  - decision: godot-modular-character-animation
    core:
      status: accepted
      confidence: confirmed
      title: Split character heads and animated outfits
      summary: "User-authorized eight-direction walking, gesticulating conversation and generic interaction animations for every current resident, using separate head and outfit layers."
      rationale:
        - "[ai] The rejected procedural SVG art is superseded by imagegen raster sprites based on the C Observational Pixels reference. Technical Godot import trims alpha and registers collars with nearest sampling; it does not draw art. Every outfit shares frame order, cell dimensions and head attachment coordinates."
        - "[ai] Facing, animation time, outfit selection and conversation partner gestures are presentation state only, derived from detached observable snapshots. No simulation timing or private outsider data is exposed."
      references: [godot-household-dashboard, godot-order-management-completion, authoritative-client-projection]
    implementation:
      status: declared
      paths: [client/character_animation.gd, client/village_view.gd, tools/import_character_atlases.gd, assets/characters, tests/animation_tests.gd]

  - decision: godot-continuous-follow-and-manual-crossings
    core:
      status: accepted
      confidence: confirmed
      title: Continuous camera follow and visible manual floor crossings
      summary: "User-requested fixes for jerky camera follow and manual stairs. Follow centres on the same interpolated position used to render the selected resident. A completed manual portal order switches the view to its destination even with follow disabled; the portal tile keeps its action when occupied."
      rationale: ["[ai] Floor focus and interpolation remain presentation state. Navigation, contention and tick ordering retain their parity behavior."]
      references: [village-client, tile-navigation, godot-modular-character-animation]
    implementation:
      status: declared
      paths: [client/main.gd, client/village_view.gd, tests/camera_portal_tests.gd]

  - decision: godot-pixel-life-hud
    core:
      status: accepted
      confidence: confirmed
      title: Pixel life-simulation control dock and contextual bubbles
      summary: "User-authorized Sims 3 inspired pixel HUD layout: vertical household portraits, a visible top-left order queue, lower-left clock and time controls, selected portrait and tabbed information along the bottom, compact world controls and contextual interaction bubbles. Supersedes the spatial arrangement of godot-floating-hud while retaining its full-window village and controls."
      rationale:
        - "[ai] Original blue-grey pixel bevels and green accents express the requested layout without importing reference artwork. Needs, orders and household knowledge keep their existing meanings; no new simulation mechanics are introduced."
        - "[ai] Narrow windows stack the resident bank above a compact time dock; interaction bubbles become a readable vertical list. HUD layout and menu placement remain client-only."
      references: [godot-floating-hud, authoritative-client-projection, right-click-offers-authored-interactions]
    implementation:
      status: declared
      paths: [client/main.gd, client/household_hud.gd, client/interaction_menu.gd, content/ui.json, tests/client_tests.gd, tests/hud_tests.gd]
