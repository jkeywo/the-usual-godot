[preset.0]
name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="assets/characters/*.json,content/*.json,tests/*.json,tests/reference/*.json"
exclude_filter="build/*,art/*,.reference/*,.tools/*,tools/*,docs/*,pasm/*,tests/reference/*.ron"
export_path="build/windows/TheUsual.exe"
[preset.0.options]
custom_template/debug=".tools/templates/windows_debug_x86_64.exe"
custom_template/release=".tools/templates/windows_release_x86_64.exe"
binary_format/architecture="x86_64"
binary_format/embed_pck=true
[preset.1]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="assets/characters/*.json,content/*.json,tests/*.json,tests/reference/*.json"
exclude_filter="build/*,art/*,.reference/*,.tools/*,tools/*,docs/*,pasm/*,tests/reference/*.ron"
export_path="build/web/index.html"
[preset.1.options]
custom_template/debug=".tools/templates/web_nothreads_debug.zip"
custom_template/release=".tools/templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
